version: 0.1

phases:
  install:
    runtime-versions:
      dotnet: 9
    commands:
      - |
        if [ -x "$(command -v dotnet)" ]; then
          echo "dotnet is available"
        else
          echo "dotnet will be installed by runtime-versions"
        fi
  build:
    commands:
      - dotnet restore MeetAgain.Server/MeetAgain.Server.csproj
      - dotnet publish MeetAgain.Server/MeetAgain.Server.csproj -c Release -o dist --self-contained false
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - "**/*"
  discard-paths: yes